<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт ИП — Эковата</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f2f4f7; --card:#ffffff; --text:#1c2126; --muted:#6b7480;
  --border:#e2e6eb; --accent:#2f9e63; --accent-soft:#e4f5ec; --accent-text:#1d7a4a;
  --danger:#d64545; --danger-soft:#fdeaea; --danger-text:#b23b3b;
  --header:#ffffff;
}
[data-theme="dark"]{
  --bg:#12151a; --card:#1b2026; --text:#e6e9ed; --muted:#8b95a1;
  --border:#2a313a; --accent:#3fbf7f; --accent-soft:#173527; --accent-text:#7fd8a8;
  --danger:#e06c6c; --danger-soft:#3a2224; --danger-text:#f0a1a1;
  --header:#171c22;
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:-apple-system,system-ui,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;background:var(--header);border-bottom:1px solid var(--border);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
button{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.tabs{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
.tab{border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--muted);padding:8px 16px}
.tab.active{color:var(--text);border-color:var(--accent);font-weight:600}
.monthbar{display:flex;align-items:center;gap:8px;margin:12px 20px 0;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;flex-wrap:wrap}
#monthName{font-weight:700;min-width:130px;text-align:center}
.sums{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sum{padding:5px 10px;border-radius:8px;font-size:13px;background:var(--bg);border:1px solid var(--border)}
.sum.in{color:var(--accent-text)} .sum.out{color:var(--danger-text)} .sum.profit{font-weight:700}
.tabpage{display:none;padding:14px 20px}
.tabpage.active{display:block}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow{text-align:center;color:var(--muted);font-weight:600;font-size:11px;padding:2px;text-transform:uppercase;letter-spacing:.4px}
.day{min-height:96px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s}
.day:hover{border-color:var(--accent)}
.day.empty{background:transparent;border:none;cursor:default}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.dnum{font-size:12px;color:var(--muted)}
.add{position:absolute;right:6px;bottom:4px;color:var(--accent);font-weight:700;opacity:0}
.day:hover .add{opacity:1}
.chip{font-size:10.5px;border-radius:5px;padding:1px 5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.income{background:var(--accent-soft);color:var(--accent-text)}
.chip.expense{background:var(--danger-soft);color:var(--danger-text)}
.charts{display:flex;gap:16px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.charts .card{flex:1;min-width:300px}
table.cmp{width:100%;border-collapse:collapse;font-size:14px}
table.cmp th,table.cmp td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left}
td.good{color:var(--accent-text)} td.bad{color:var(--danger-text)}
tr.total td{font-weight:700;border-top:2px solid var(--text)}
.type{font-size:11px;border-radius:4px;padding:1px 6px}
.type.income{background:var(--accent-soft);color:var(--accent-text)}
.type.expense{background:var(--danger-soft);color:var(--danger-text)}
.setrow{display:flex;gap:12px;flex-wrap:wrap}
.setrow label{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.modalbox input,.modalbox select,.setrow input,.setrow select{padding:8px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text)}
#ecoStats{line-height:1.7;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modalbox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;width:360px;max-width:100%;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
.modalbox label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
.sheet{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;width:440px;max-width:100%;display:flex;flex-direction:column;gap:8px;max-height:85vh;overflow:auto}
.sheet h3{margin:0 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row .amt{font-weight:600;white-space:nowrap}
.row .amt.in{color:var(--accent-text)} .row .amt.out{color:var(--danger-text)}
.hidden{display:none!important}
@media (max-width:640px){
  header{padding:12px 14px} .tabs,.tabpage{padding-left:12px;padding-right:12px}
  .monthbar{margin:10px 12px 0}
  .sums{margin-left:0;width:100%;justify-content:space-between}
  .calendar{gap:3px}
  .day{min-height:64px;padding:3px;border-radius:8px}
  .dnum{font-size:10px}
  .chip{font-size:8.5px;padding:0 3px}
  .add{display:none}
  .tab{padding:8px 10px;font-size:12px}
  .modal{align-items:flex-end;padding:0}
  .modalbox,.sheet{width:100%;max-width:100%;border-radius:14px 14px 0 0}
}
</style>
</head>
<body>
<header>
  <div><h1>Учёт ИП — производство и утепление эковатой</h1><div class="hint">данные общие для компа и телефона</div></div>
  <div class="actions"><button id="btnTheme">Тёмная тема</button><button id="btnExcel">Excel</button><button id="btnExport">JSON</button><button id="btnImport">Импорт</button><input type="file" id="fileImport" hidden accept=".json"></div>
</header>
<nav class="tabs">
  <button class="tab active" data-tab="cal">Календарь</button>
  <button class="tab" data-tab="charts">Диаграммы</button>
  <button class="tab" data-tab="cmp">Сравнение</button>
  <button class="tab" data-tab="set">Настройки</button>
</nav>
<div class="monthbar">
  <button id="prevM">‹</button><span id="monthName">Загрузка…</span><button id="nextM">›</button>
  <div class="sums">
    <span class="sum in" id="sumIn"></span><span class="sum out" id="sumOut"></span>
    <span class="sum profit" id="sumProfit"></span><span class="sum out" id="sumTax"></span><span class="sum profit" id="sumAfter"></span>
  </div>
</div>

<section id="tab-cal" class="tabpage active"><div id="calendar" class="calendar"></div></section>

<section id="tab-charts" class="tabpage"><div class="charts">
  <div class="card"><h3>Расходы по статьям за месяц</h3><canvas id="chartPie"></canvas></div>
  <div class="card"><h3>Доходы и расходы, 6 месяцев</h3><canvas id="chartBars"></canvas></div>
</div></section>

<section id="tab-cmp" class="tabpage">
  <div class="card"><h3 id="cmpTitle"></h3>
    <table class="cmp"><thead><tr><th>Статья</th><th id="thPrev"></th><th id="thCur"></th><th>Изменение</th></tr></thead><tbody id="cmpBody"></tbody></table>
  </div>
  <div class="card"><h3>Выбросы и аномалии</h3><div id="outliers"></div></div>
</section>

<section id="tab-set" class="tabpage">
  <div class="card"><h3>Эковата</h3><div id="ecoStats"></div></div>
  <div class="card"><h3>Параметры</h3>
    <div class="setrow">
      <label>Тариф электроэнергии, ₽ за кВт·ч<input type="number" id="setTariff" step="0.1" min="0"></label>
      <label>Налог, % с дохода<input type="number" id="setTax" step="0.5" min="0"></label>
    </div>
    <div style="margin-top:12px"><button id="btnSetSave" class="primary">Сохранить параметры</button></div>
    <div id="taxInfo" class="hint" style="margin-top:12px"></div>
  </div>
</section>

<div id="daySheet" class="modal hidden"><div class="sheet">
  <h3 id="sheetTitle"></h3>
  <div id="sheetList" style="display:flex;flex-direction:column;gap:8px"></div>
  <button id="sheetAdd" class="primary">Добавить запись</button>
  <button id="sheetClose">Закрыть</button>
</div></div>

<div id="modal" class="modal hidden"><div class="modalbox">
  <h3 id="modalTitle" style="margin:0">Запись</h3>
  <label>Дата<input type="date" id="fDate"></label>
  <label>Тип<select id="fType"><option value="income">Доход</option><option value="expense">Расход</option></select></label>
  <label>Статья<input id="fCat" list="catsList" placeholder="Напр.: Электроэнергия"><datalist id="catsList"></datalist></label>
  <label id="wrapUnit" class="hidden">Единицы<select id="fUnit"><option value="rub">рубли</option><option value="kwh">кВт·ч (пересчитается по тарифу)</option></select></label>
  <label id="wrapBags" class="hidden">Мешки эковаты (необязательно)<input type="number" id="fBags" min="0" step="1"></label>
  <label>Сумма, ₽<input type="number" id="fAmount" min="0" step="1"></label>
  <label>Комментарий / объект<input id="fNote" placeholder="Напр.: дом на ул. Лесная"></label>
  <div class="mbtns"><button id="btnDelete" class="danger hidden">Удалить</button><button id="btnSave" class="primary">Сохранить</button><button id="btnCancel">Отмена</button></div>
</div></div>

<script>
if(typeof DB==='undefined'){document.body.innerHTML='<p style="padding:30px;font-size:16px">Рядом с index.html нет файла config.js. Создай его со строкой: const DB="твой адрес базы";</p>';throw new Error('no config')}
const $=id=>document.getElementById(id);
const CATS={
  income:['Утепление эковатой','Продажа эковаты','Прочие доходы'],
  expense:['Электроэнергия','Топливо','Зарплаты','Сырьё','Аренда','Ремонт и оборудование','Налоги']
};
const ECO_CATS=['Утепление эковатой','Продажа эковаты'];
const PALETTE=['#d9534f','#f0ad4e','#5bc0de','#5cb85c','#9b59b6','#34495e','#e67e22','#1abc9c','#8e44ad','#7f8c8d'];
let entries=[],view=new Date(),editId=null,pie=null,bars=null,sheetDate=null;
let settings={tariff:5,taxPct:18};
view.setDate(1);
const fmt=n=>(+n).toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽';
const mKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const monthName=d=>{const s=d.toLocaleString('ru-RU',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
function monthSums(mk){let i=0,o=0;entries.forEach(e=>{if(e.date.startsWith(mk)){e.type==='income'?i+=+e.amount:o+=+e.amount}});return{i,o}}
function entryBags(e){return e.bags!=null?+e.bags:(e.kg?+e.kg/10:0)}

function updateThemeBtn(){$('btnTheme').textContent=document.documentElement.dataset.theme==='dark'?'Светлая тема':'Тёмная тема'}
$('btnTheme').onclick=()=>{
  const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t; localStorage.setItem('theme',t);
  updateThemeBtn();
  if($('tab-charts').classList.contains('active'))renderCharts();
};
updateThemeBtn();

async function load(){
  try{
    const s=await (await fetch(DB+'/settings.json')).json();
    if(s)settings=Object.assign(settings,s);
    const obj=await (await fetch(DB+'/entries.json')).json();
    entries=obj?Object.values(obj):[];
    entries.sort((a,b)=>a.date<b.date?-1:1);
  }catch(e){$('monthName').textContent='Не удалось загрузить данные!';return}
  renderAll();
}
function renderAll(){
  $('monthName').textContent=monthName(view);
  const s=monthSums(mKey(view));
  const tax=Math.round(s.i*settings.taxPct/100);
  $('sumIn').textContent='Доходы: '+fmt(s.i);
  $('sumOut').textContent='Расходы: '+fmt(s.o);
  $('sumProfit').textContent='Прибыль: '+fmt(s.i-s.o);
  $('sumTax').textContent='Налог ('+settings.taxPct+'%): −'+fmt(tax);
  $('sumAfter').textContent='После налога: '+fmt(s.i-s.o-tax);
  renderCalendar();
  if($('tab-charts').classList.contains('active'))renderCharts();
  if($('tab-cmp').classList.contains('active'))renderCmpTab();
  if($('tab-set').classList.contains('active'))renderSettings();
}
function renderCalendar(){
  const y=view.getFullYear(),m=view.getMonth();
  const offset=(new Date(y,m,1).getDay()+6)%7, days=new Date(y,m+1,0).getDate();
  const t=new Date(), tk=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  let h=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<div class="dow">${w}</div>`).join('');
  for(let i=0;i<offset;i++)h+='<div class="day empty"></div>';
  for(let d=1;d<=days;d++){
    const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const chips=entries.filter(e=>e.date===key).map(e=>{
      let extra=''; const b=entryBags(e); if(b)extra+=', '+b+' мешков'; if(e.kwh)extra+=', '+e.kwh+' кВт·ч';
      return `<div class="chip ${e.type}" title="${e.category}${extra}${e.note?' — '+e.note:''}">${e.category} · ${e.type==='income'?'+':'−'}${fmt(e.amount)}</div>`;
    }).join('');
    h+=`<div class="day${key===tk?' today':''}" data-date="${key}"><span class="dnum">${d}</span>${chips}<span class="add">+</span></div>`;
  }
  $('calendar').innerHTML=h;
}
$('calendar').addEventListener('click',ev=>{
  const day=ev.target.closest('.day'); if(!day||!day.dataset.date)return;
  const list=entries.filter(e=>e.date===day.dataset.date);
  if(list.length)openSheet(day.dataset.date); else openModal(day.dataset.date,null);
});
function openSheet(dateKey){
  sheetDate=dateKey;
  $('sheetTitle').textContent=new Date(dateKey+'T00:00:00').toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  $('sheetList').innerHTML=entries.filter(e=>e.date===dateKey).map(e=>{
    let extra=''; const b=entryBags(e); if(b)extra+=' · '+b+' мешк.'; if(e.kwh)extra+=' · '+e.kwh+' кВт·ч';
    return `<button class="row" data-id="${e.id}"><span>${e.category}${extra}${e.note?' — '+e.note:''}</span><span class="amt ${e.type==='income'?'in':'out'}">${e.type==='income'?'+':'−'}${fmt(e.amount)}</span></button>`;
  }).join('');
  $('daySheet').classList.remove('hidden');
}
const closeSheet=()=>$('daySheet').classList.add('hidden');
$('daySheet').addEventListener('click',ev=>{if(ev.target===$('daySheet'))closeSheet()});
$('sheetClose').onclick=closeSheet;
$('sheetAdd').onclick=()=>{const d=sheetDate;closeSheet();openModal(d,null)};
$('sheetList').addEventListener('click',ev=>{
  const row=ev.target.closest('.row'); if(!row)return;
  const d=sheetDate; closeSheet(); openModal(d,row.dataset.id);
});
function fillCats(){
  const t=$('fType').value;
  const used=[...new Set(entries.filter(e=>e.type===t).map(e=>e.category))];
  $('catsList').innerHTML=[...new Set([...CATS[t],...used])].map(c=>`<option value="${c}">`).join('');
}
function updateModalExtras(){
  const cat=$('fCat').value, t=$('fType').value;
  $('wrapUnit').classList.toggle('hidden',!(t==='expense'&&cat==='Электроэнергия'));
  $('wrapBags').classList.toggle('hidden',!(t==='income'&&ECO_CATS.includes(cat)));
}
function openModal(dateStr,id){
  editId=id; const e=id?entries.find(x=>x.id===id):null;
  $('fDate').value=e?e.date:dateStr;
  $('fType').value=e?e.type:'expense'; fillCats();
  $('fCat').value=e?e.category:'';
  if(e&&e.kwh){$('fUnit').value='kwh';$('fAmount').value=e.kwh}else{$('fUnit').value='rub';$('fAmount').value=e?e.amount:''}
  $('fBags').value=e?entryBags(e)||'':'';
  $('fNote').value=e?(e.note||''):'';
  updateModalExtras();
  $('btnDelete').classList.toggle('hidden',!id);
  $('modalTitle').textContent=e?'Редактировать запись':'Новая запись';
  $('modal').classList.remove('hidden');
}
const closeModal=()=>$('modal').classList.add('hidden');
$('modal').addEventListener('click',ev=>{if(ev.target===$('modal'))closeModal()});
$('btnCancel').onclick=closeModal;
$('fType').onchange=()=>{fillCats();updateModalExtras()};
$('fCat').addEventListener('input',updateModalExtras);
$('btnSave').onclick=async()=>{
  const val=parseFloat($('fAmount').value), cat=$('fCat').value.trim();
  if(!cat||!(val>0)){alert('Укажи статью и сумму');return}
  const data={date:$('fDate').value,type:$('fType').value,category:cat,note:$('fNote').value.trim()};
  if(!$('wrapUnit').classList.contains('hidden')&&$('fUnit').value==='kwh'){
    data.kwh=val; data.amount=Math.round(val*settings.tariff);
  }else{data.amount=val}
  const bags=parseFloat($('fBags').value); if(bags>0)data.bags=bags;
  data.id=editId||('e'+Date.now()+Math.floor(Math.random()*1e4));
  await fetch(DB+'/entries/'+data.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  closeModal(); load();
};
$('btnDelete').onclick=async()=>{await fetch(DB+'/entries/'+editId+'.json',{method:'DELETE'});closeModal();load()};
$('prevM').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderAll()};
$('nextM').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderAll()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.tabpage').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); $('tab-'+b.dataset.tab).classList.add('active');
  if(b.dataset.tab==='charts')renderCharts();
  if(b.dataset.tab==='cmp')renderCmpTab();
  if(b.dataset.tab==='set')renderSettings();
});
function renderSettings(){
  $('setTariff').value=settings.tariff;
  $('setTax').value=settings.taxPct;
  const mk=mKey(view);
  let monthB=0,totalB=0;
  entries.forEach(e=>{const b=entryBags(e); if(b){totalB+=b; if(e.date.startsWith(mk))monthB+=b}});
  $('ecoStats').innerHTML=
    'За '+view.toLocaleString('ru-RU',{month:'long'})+': <b>'+monthB+' мешков</b> ('+(monthB*10)+' кг)<br>'+
    'Всего: <b>'+totalB+' мешков</b> ('+(totalB*10)+' кг)';
  const s=monthSums(mk);
  const tax=Math.round(s.i*settings.taxPct/100);
  let paid=0; entries.forEach(e=>{if(e.type==='expense'&&e.category==='Налоги'&&e.date.startsWith(mk))paid+=+e.amount});
  $('taxInfo').innerHTML=monthName(view)+': начислено с дохода <b>'+fmt(tax)+'</b>, оплачено по факту <b>'+fmt(paid)+'</b>. '+(paid<tax?'Осталось доплатить '+fmt(tax-paid)+'.':'Переплата '+fmt(paid-tax)+'.')+' Статья «Налоги» в расходах — фактические платежи, процент выше — расчётная сумма для конца месяца.';
}
$('btnSetSave').onclick=async()=>{
  settings.tariff=parseFloat($('setTariff').value)||0;
  settings.taxPct=parseFloat($('setTax').value)||0;
  await fetch(DB+'/settings.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings)});
  alert('Сохранено'); renderAll();
};
function renderCharts(){
  const css=getComputedStyle(document.documentElement);
  Chart.defaults.color=css.getPropertyValue('--muted').trim();
  Chart.defaults.borderColor=css.getPropertyValue('--border').trim();
  const mk=mKey(view), byCat={};
  entries.forEach(e=>{if(e.type==='expense'&&e.date.startsWith(mk))byCat[e.category]=(byCat[e.category]||0)+ +e.amount});
  if(pie)pie.destroy();
  pie=new Chart($('chartPie'),{type:'doughnut',data:{labels:Object.keys(byCat),datasets:[{data:Object.values(byCat),backgroundColor:PALETTE}]},options:{plugins:{legend:{position:'bottom'}}}});
  const ms=[];for(let k=5;k>=0;k--)ms.push(new Date(view.getFullYear(),view.getMonth()-k,1));
  if(bars)bars.destroy();
  bars=new Chart($('chartBars'),{type:'bar',data:{labels:ms.map(d=>d.toLocaleString('ru-RU',{month:'short'})),datasets:[
    {label:'Доходы',data:ms.map(d=>monthSums(mKey(d)).i),backgroundColor:'#2e9e5b'},
    {label:'Расходы',data:ms.map(d=>monthSums(mKey(d)).o),backgroundColor:'#d9534f'}]}});
}
function sumsByCat(mk){const r={};entries.forEach(e=>{if(e.date.startsWith(mk)){r[e.category]=r[e.category]||{income:0,expense:0};r[e.category][e.type]+=+e.amount}});return r}
function catMonth(c,mk){let s=0;entries.forEach(e=>{if(e.type==='expense'&&e.category===c&&e.date.startsWith(mk))s+=+e.amount});return s}
function renderCmpTab(){
  const prevD=new Date(view.getFullYear(),view.getMonth()-1,1);
  const cur=mKey(view),prev=mKey(prevD);
  $('cmpTitle').textContent=monthName(view)+' против '+monthName(prevD);
  $('thPrev').textContent=prevD.toLocaleString('ru-RU',{month:'long'});
  $('thCur').textContent=view.toLocaleString('ru-RU',{month:'long'});
  const a=sumsByCat(cur),b=sumsByCat(prev);
  let rows='';
  [...new Set([...Object.keys(a),...Object.keys(b)])].forEach(c=>{
    const row=(type,pv,cv)=>{const d=cv-pv,pct=pv>0?Math.round(d/pv*100)+'%':'—';
      const cls=type==='expense'?(d>0?'bad':'good'):(d>0?'good':'bad');
      return `<tr><td>${c} <span class="type ${type}">${type==='expense'?'расход':'доход'}</span></td><td>${fmt(pv)}</td><td>${fmt(cv)}</td><td class="${cls}">${d>0?'+':''}${fmt(d)} (${pct})</td></tr>`};
    if((a[c]||{}).expense||(b[c]||{}).expense)rows+=row('expense',(b[c]||{}).expense||0,(a[c]||{}).expense||0);
    if((a[c]||{}).income||(b[c]||{}).income)rows+=row('income',(b[c]||{}).income||0,(a[c]||{}).income||0);
  });
  const s1=monthSums(prev),s2=monthSums(cur);
  rows+=`<tr class="total"><td>Прибыль</td><td>${fmt(s1.i-s1.o)}</td><td>${fmt(s2.i-s2.o)}</td><td>${fmt((s2.i-s2.o)-(s1.i-s1.o))}</td></tr>`;
  $('cmpBody').innerHTML=rows||'<tr><td colspan="4">Пока нет данных за эти месяцы</td></tr>';
  const out=[];
  [...new Set(entries.filter(e=>e.type==='expense').map(e=>e.category))].forEach(c=>{
    const cv=catMonth(c,cur);
    const avg=([1,2,3].reduce((s,k)=>s+catMonth(c,mKey(new Date(view.getFullYear(),view.getMonth()-k,1))),0))/3;
    if(cv>0&&avg>0&&cv>=avg*1.5)out.push('<b>Всплеск — '+c+':</b> '+fmt(cv)+' при средней '+fmt(avg)+' за 3 прошлых месяца (+'+Math.round((cv-avg)/avg*100)+'%)');
  });
  const top=entries.filter(e=>e.type==='expense'&&e.date.startsWith(cur)).sort((x,y)=>y.amount-x.amount).slice(0,3);
  if(top.length){out.push('<b>Крупнейшие траты месяца:</b>');top.forEach(e=>out.push('— '+e.category+': '+fmt(e.amount)+(e.note?' ('+e.note+')':'')))}
  $('outliers').innerHTML=out.join('<br>')||'Аномалий не замечено';
}
$('btnExcel').onclick=()=>{
  const aoa=[['Дата','Тип','Статья','Сумма','Мешки','Комментарий']];
  entries.forEach(e=>aoa.push([e.date,e.type==='income'?'Доход':'Расход',e.category,+e.amount,entryBags(e)||'',e.note||'']));
  let ti=0,to=0; entries.forEach(e=>e.type==='income'?ti+=+e.amount:to+=+e.amount);
  aoa.push([]);
  aoa.push(['','','Доходы',ti,'','']);
  aoa.push(['','','Расходы',to,'','']);
  aoa.push(['','','ПРИБЫЛЬ',ti-to,'','']);
  if(!window.XLSX){alert('Библиотека не загрузилась, проверь интернет');return}
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let R=range.s.r;R<=range.e.r;R++){
    const typeCell=ws[XLSX.utils.encode_cell({r:R,c:1})];
    const nameCell=ws[XLSX.utils.encode_cell({r:R,c:2})];
    let style=null;
    if(typeCell&&typeCell.v==='Расход')style={fill:{fgColor:{rgb:'F8CBAD'}},font:{color:{rgb:'9C0006'}}};
    if(nameCell&&nameCell.v==='Доходы')style={font:{color:{rgb:'006100'}},fill:{fgColor:{rgb:'E2EFDA'}}};
    if(nameCell&&nameCell.v==='ПРИБЫЛЬ')style={font:{color:{rgb:'006100'},bold:true},fill:{fgColor:{rgb:'C6EFCE'}}};
    if(style)for(let C=0;C<=5;C++){const ref=XLSX.utils.encode_cell({r:R,c:C});if(!ws[ref])ws[ref]={t:'z',v:''};ws[ref].s=style;}
  }
  ws['!cols']=[{wch:12},{wch:8},{wch:26},{wch:12},{wch:8},{wch:30}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Учёт');
  XLSX.writeFile(wb,'uchet.xlsx');
};
$('btnExport').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(entries,null,2)],{type:'application/json'}));
  a.download='uchet-ekovata.json';a.click();
};
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=async ev=>{
  const r=new FileReader();
  r.onload=async()=>{try{
    const d=JSON.parse(r.result);
    if(!Array.isArray(d))throw 0;
    for(const e of d){e.id=e.id||('e'+Date.now()+Math.floor(Math.random()*1e6));
      await fetch(DB+'/entries/'+e.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(e)});}
    alert('Импортировано записей: '+d.length); load();
  }catch(e){alert('Не удалось прочитать файл')}};
  r.readAsText(ev.target.files[0]);
};
load();
</script>
